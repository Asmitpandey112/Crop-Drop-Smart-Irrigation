version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: cropdrop_user
      POSTGRES_PASSWORD: cropdrop_password
      POSTGRES_DB: cropdrop_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cropdrop_user -d cropdrop_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Connects to the Postgres container named 'db'
      - DATABASE_URL=postgresql://cropdrop_user:cropdrop_password@db:5432/cropdrop_db
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # For a local Docker deployment, tell the browser to hit localhost:8000
        # For actual cloud production, this would be your real domain (e.g., https://api.cropdrop.com/api)
        - VITE_API_URL=http://localhost:8000/api
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
